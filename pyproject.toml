[project]
name = "comment-moderator"
version = "0.1.0"
description = "Comment-Moderator — free hybrid YouTube comment triage assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]

transformer = [
    "detoxify>=0.5.0",
    "torch>=2.2.0",
    "transformers>=4.41.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "research"]